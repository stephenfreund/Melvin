[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moverlogic"
version = "0.1.0"
description = "A verifier for Mover Logic (reduction-based rely-guarantee) using Boogie"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "Mover Logic implementation" }]
keywords = ["verification", "concurrency", "reduction", "rely-guarantee", "boogie"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
moverlogic = "moverlogic.cli:main"

[tool.setuptools]
packages = ["moverlogic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
