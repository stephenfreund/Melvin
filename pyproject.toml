[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "melvin"
version = "0.1.0"
description = "Melvin: a verifier for Mover Logic (reduction-based rely-guarantee) using Boogie"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "Melvin implementation" }]
keywords = ["verification", "concurrency", "reduction", "rely-guarantee", "boogie"]
dependencies = ["pytest>=7.0"]

[project.scripts]
melvin = "melvin.cli:main"
melvin-run = "melvin.interp:main"

[tool.setuptools]
packages = ["melvin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
